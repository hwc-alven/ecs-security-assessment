<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ECS Security Assessment</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d1b2a 0%, #1a237e 50%, #283593 100%);
            position: relative;
            overflow: hidden;
        }
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(33,150,243,0.08) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 420px;
            max-width: 90vw;
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        .login-title {
            color: #1a237e;
            font-size: 1.5em;
            font-weight: 700;
            margin: 0;
        }
        .login-subtitle {
            color: #78909c;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-weight: 600;
            color: #37474f;
            margin-bottom: 6px;
            font-size: 0.9em;
        }
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .login-form input:focus {
            border-color: #1a237e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,35,126,0.1);
        }
        .login-form input.error-border {
            border-color: #f44336;
            box-shadow: 0 0 0 3px rgba(244,67,54,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 5px;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26,35,126,0.3);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .login-error.show { display: block; }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #9e9e9e;
            font-size: 0.8em;
        }
        .login-hint {
            background: #e3f2fd;
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 20px;
            font-size: 0.82em;
            color: #1565c0;
            text-align: center;
        }
        .login-hint code {
            background: rgba(21,101,192,0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: #9e9e9e;
            padding: 4px;
        }
        .password-toggle-btn:hover { color: #616161; }
        .login-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <span class="login-icon">🔒</span>
                <h1 class="login-title">ECS Security Assessment</h1>
                <p class="login-subtitle">VM Security Hardening Assessment Console</p>
            </div>

            <div id="login-error" class="login-error">
                <span id="login-error-text"></span>
            </div>

            <form class="login-form" id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username"
                           autocomplete="username"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">🔑 Password</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>
                        <button type="button" class="password-toggle-btn"
                                onclick="togglePassword()" id="toggle-btn">👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    Sign In
                </button>
            </form>

            <div class="login-hint">
                Default credentials: <code>admin</code> / <code>ChangeMe!2024</code><br>
                <small>⚠️ Change the password immediately after first login</small>
            </div>

            <div class="login-footer">
                ECS VM Security Hardening Assessment Console v1.1<br>
                © 2026 — Read-only assessment, no server modifications
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('toggle-btn');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('login-error');
            const errText = document.getElementById('login-error-text');
            errText.textContent = msg;
            errBox.classList.add('show');
            document.getElementById('password').classList.add('error-border');
            setTimeout(() => {
                document.getElementById('password').classList.remove('error-border');
            }, 2000);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="login-spinner"></span> Signing in...';

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await resp.json();

                if (data.success) {
                    btn.innerHTML = '✅ Redirecting...';
                    window.location.href = data.redirect || '/';
                } else {
                    showError(data.error || 'Invalid credentials.');
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In';
                }
            } catch (err) {
                showError('Network error. Please check your connection and try again.');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
