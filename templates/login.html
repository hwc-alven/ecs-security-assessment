<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ECS Security Assessment</title>
    <script>
        (function() {
            var saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/style.css?v=5">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d1b2a 0%, #1a237e 50%, #283593 100%);
            position: relative;
            overflow: hidden;
        }
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(33,150,243,0.08) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .login-card {
            background: var(--theme-bg-card);
            border: 1px solid var(--theme-border);
            border-radius: 16px;
            box-shadow: var(--theme-shadow-card);
            width: 420px;
            max-width: 90vw;
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        .login-title {
            color: var(--theme-text-primary);
            font-size: 1.5em;
            font-weight: 700;
            margin: 0;
        }
        .login-subtitle {
            color: var(--theme-text-secondary);
            font-size: 0.9em;
            margin-top: 5px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-weight: 600;
            color: var(--theme-text-secondary);
            margin-bottom: 6px;
            font-size: 0.9em;
        }
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--theme-border);
            border-radius: 8px;
            background: var(--theme-bg-input);
            color: var(--theme-text-primary);
            font-size: 1em;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .login-form input:focus {
            border-color: var(--theme-accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--theme-accent-glow);
        }
        .login-form input.error-border {
            border-color: var(--theme-error);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 5px;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26,35,126,0.3);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-error {
            background: rgba(239, 68, 68, 0.08);
            border-left: 4px solid var(--theme-error);
            color: var(--theme-error);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .login-error.show { display: block; }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--theme-text-muted);
            font-size: 0.8em;
        }
        .login-hint {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid var(--theme-border);
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 20px;
            font-size: 0.82em;
            color: var(--theme-text-secondary);
            text-align: center;
        }
        .login-hint code {
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            color: var(--theme-accent);
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: var(--theme-text-muted);
            padding: 4px;
        }
        .password-toggle-btn:hover { color: var(--theme-text-primary); }
        .login-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--theme-border);
            background: var(--theme-bg-card);
            color: var(--theme-text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .theme-toggle:hover {
            border-color: var(--theme-accent);
            color: var(--theme-accent);
        }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .sun-icon { display: none; }
        .theme-toggle .moon-icon { display: block; }
        [data-theme="light"] .theme-toggle .sun-icon { display: block; }
        [data-theme="light"] .theme-toggle .moon-icon { display: none; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light/dark theme" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <span class="login-icon">🔒</span>
                <h1 class="login-title">ECS Security Assessment</h1>
                <p class="login-subtitle">VM Security Hardening Assessment Console</p>
            </div>

            <div id="login-error" class="login-error">
                <span id="login-error-text"></span>
            </div>

            <form class="login-form" id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username"
                           autocomplete="username"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">🔑 Password</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>
                        <button type="button" class="password-toggle-btn"
                                onclick="togglePassword()" id="toggle-btn">👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    Sign In
                </button>
            </form>

            <div class="login-hint">
                Default credentials: <code>admin</code> / <code>ChangeMe!2024</code><br>
                <small>⚠️ Change the password immediately after first login</small>
            </div>

            <div class="login-footer">
                ECS VM Security Hardening Assessment Console v1.1<br>
                © 2026 — Read-only assessment, no server modifications
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('toggle-btn');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('login-error');
            const errText = document.getElementById('login-error-text');
            errText.textContent = msg;
            errBox.classList.add('show');
            document.getElementById('password').classList.add('error-border');
            setTimeout(() => {
                document.getElementById('password').classList.remove('error-border');
            }, 2000);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="login-spinner"></span> Signing in...';

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await resp.json();

                if (data.success) {
                    btn.innerHTML = '✅ Redirecting...';
                    window.location.href = data.redirect || '/';
                } else {
                    showError(data.error || 'Invalid credentials.');
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In';
                }
            } catch (err) {
                showError('Network error. Please check your connection and try again.');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
