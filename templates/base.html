<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ECS Security Assessment{% endblock %}</title>
    <script>
        (function() {
            var saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>




    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <a href="/" class="nav-brand">
                <span class="nav-brand-icon">🔒</span>
                <span class="nav-brand-text">ECS Security Console</span>
            </a>
        </div>

        <div class="nav-menu" id="nav-menu">
            <div class="nav-group">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                    <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
                </a>
                <a href="/keypair" class="nav-link {% if request.url.path == '/keypair' %}active{% endif %}">
                    <span class="nav-icon">🔑</span><span class="nav-label">Keypair</span>
                </a>
                <a href="/servers" class="nav-link {% if request.url.path == '/servers' %}active{% endif %}">
                    <span class="nav-icon">🖥️</span><span class="nav-label">Servers</span>
                </a>
                <a href="/assessment" class="nav-link {% if request.url.path == '/assessment' %}active{% endif %}">
                    <span class="nav-icon">🛡️</span><span class="nav-label">Assessment</span>
                </a>
                <a href="/config" class="nav-link {% if request.url.path == '/config' %}active{% endif %}">
                    <span class="nav-icon">⚙️</span><span class="nav-label">Config</span>
                </a>
                <a href="/report" class="nav-link {% if request.url.path == '/report' %}active{% endif %}">
                    <span class="nav-icon">📄</span><span class="nav-label">Reports</span>
                </a>
            </div>

            <div class="nav-divider"></div>

            <div class="nav-group">
                <a href="/audit-log" class="nav-link {% if request.url.path == '/audit-log' %}active{% endif %}">
                    <span class="nav-icon">📋</span><span class="nav-label">Audit</span>
                </a>
                <a href="/regcodes" class="nav-link {% if request.url.path == '/regcodes' %}active{% endif %}">
                    <span class="nav-icon">🎟️</span><span class="nav-label">Codes</span>
                </a>
                <a href="/account" class="nav-link {% if request.url.path == '/account' %}active{% endif %}">
                    <span class="nav-icon">👤</span><span class="nav-label">Account</span>
                </a>
            </div>

            <div class="nav-divider"></div>

                        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light/dark theme">
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>




            <a href="/login" class="nav-link nav-logout" onclick="return confirmLogout()">
                <span class="nav-icon">🚪</span><span class="nav-label">Logout</span>
            </a>
        </div>
    </nav>

    <main class="container">{% block content %}{% endblock %}</main>

    <footer class="footer">
        <p>ECS VM Security Hardening Assessment Console v1.3 | Read-only assessment — no server modifications</p>
    </footer>

    <script src="/static/js/app.js?v=10"></script>
    <script>
        async function confirmLogout() {
            if (!confirm('Are you sure you want to log out?')) return false;
            try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login';
            return false;
        }
        document.getElementById('nav-toggle')?.addEventListener('click', () => {
            document.getElementById('nav-menu').classList.toggle('open');
            document.getElementById('nav-toggle').classList.toggle('active');
        });
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('nav-menu');
            const toggle = document.getElementById('nav-toggle');
            if (menu?.classList.contains('open') && !menu.contains(e.target) && !toggle?.contains(e.target)) {
                menu.classList.remove('open');
                toggle?.classList.remove('active');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
